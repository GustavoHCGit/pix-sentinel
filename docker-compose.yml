services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pixsentinel
      POSTGRES_USER: pixsentinel
      POSTGRES_PASSWORD: pixsentinel
    ports:
      - "5432:5432"

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command: ["redpanda", "start", "--overprovisioned", "--smp=1", "--memory=1G", "--reserve-memory=0M", "--check=false", "--node-id=0", "--kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092", "--advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092"]
    ports:
      - "19092:19092"
